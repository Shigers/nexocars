<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Chrome / Cyan Neon Gradients -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Curved Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  <rect x="6" y="6" width="500" height="500" rx="109" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Ambient Glow Behind Car -->
  <ellipse cx="256" cy="190" rx="180" ry="80" fill="#2563eb" opacity="0.18" filter="blur(35px)" />

  <!-- ================= LUXURY SUPERCAR SILHOUETTE ================= -->
  <!-- Aerodynamic Roofline & Fastback Curve -->
  <path d="M 90 230 C 130 205, 175 145, 256 145 C 337 145, 382 205, 422 230" 
        fill="none" stroke="url(#carBody)" stroke-width="12" stroke-linecap="round" />

  <!-- Windshield Pillar Accent -->
  <path d="M 175 200 Q 256 160, 337 200" 
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- Lower Body & Front Splitter -->
  <path d="M 80 230 L 140 260 L 372 260 L 432 230" 
        fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

  <!-- Aggressive LED Headlights (Left & Right) -->
  <path d="M 105 240 L 160 250 L 135 256 Z" fill="#38bdf8" />
  <circle cx="140" cy="248" r="4.5" fill="#ffffff" />

  <path d="M 407 240 L 352 250 L 377 256 Z" fill="#38bdf8" />
  <circle cx="372" cy="248" r="4.5" fill="#ffffff" />

  <!-- Central Grille Aero Line -->
  <line x1="210" y1="260" x2="302" y2="260" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />

  <!-- ================= BOLD 'NEXOCAR' WORDMARK ================= -->
  <!-- Soft Underglow for Text -->
  <text x="256" y="365" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="78" 
        letter-spacing="4" 
        fill="#0284c7" 
        text-anchor="middle" 
        opacity="0.4" 
        filter="blur(10px)">NEXOCAR</text>

  <!-- Crisp Main NEXOCAR Text -->
  <text x="256" y="365" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="78" 
        letter-spacing="4" 
        text-anchor="middle">
    <tspan fill="#ffffff">NEXO</tspan>
    <tspan fill="#38bdf8">CAR</tspan>
  </text>

  <!-- Subtitle Tagline: Orlando Cars & Loewe -->
  <text x="256" y="415" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="700" 
        font-size="20" 
        letter-spacing="5" 
        fill="#94a3b8" 
        text-anchor="middle">ORLANDO CARS</text>

  <!-- Sleek Accent Underline -->
  <rect x="186" y="440" width="140" height="4" rx="2" fill="url(#neon)" />
</svg>